[project]
name = "ninety-labs"
version = "0.1.0"
description = "Auto-eventing from synthetic broadcast video, explained by agents, personalized for every fan."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "agent-framework-core>=1.21.0",
    "agent-framework-foundry>=1.14.1",
    "azure-identity>=1.26.0",
    "httpx>=0.28.1",
    "jsonschema>=4",
    "mcp>=1.24,<2",
]

[project.scripts]
ninety-sim = "ninety.sim.cli:main"
ninety-slice = "ninety.agents.slice:main"
ninety-validate = "ninety.validate:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ninety"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
