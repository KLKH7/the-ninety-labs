[project]
name = "ninety-labs"
version = "0.1.0"
description = "Auto-eventing from synthetic broadcast video, explained by agents, personalized for every fan."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "a2a-sdk[http-server]>=1.2.3",
    "agent-framework-core>=1.21.0",
    "agent-framework-foundry>=1.14.1",
    "azure-ai-projects>=2.7.0",
    "azure-identity>=1.26.0",
    "azure-monitor-opentelemetry>=1.8.10,<2",
    "httpx>=0.28.1",
    "jsonschema>=4",
    "mcp>=1.24,<2",
    "playwright==1.56.0",
    "starlette>=1.8.0",
    "uvicorn>=0.54.0",
    "websockets>=15",
]

[project.scripts]
ninety-sim = "ninety.sim.cli:main"
ninety-slice = "ninety.agents.slice:main"
ninety-workflow = "ninety.agents.workflow:main"
ninety-live = "ninety.agents.live:main"
ninety-agents = "ninety.agents.foundry:main"
ninety-validate = "ninety.validate:main"
ninety-render = "ninety.render.cli:render_main"
ninety-dataset = "ninety.render.cli:dataset_main"
ninety-render-check = "ninety.render.cli:check_main"
ninety-render-meta = "ninety.render.cli:meta_main"
ninety-grid = "ninety.sim.grid:main"
ninety-data-stats = "ninety.vision.data_stats:main"
ninety-e2e = "ninety.e2e:main"
ninety-football-sense = "ninety.eval.football_sense:main"

[dependency-groups]
dev = [
    "numpy>=2",  # the camera fit of event detection (ninety/vision/pitch.py), tested in CI
    "pillow>=11",  # images for the runtime truth guard of event detection (tests/test_vision_live_path.py)
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff>=0.17.0",
]
render-job = [
    "azure-storage-blob>=12",
    "azure-storage-queue>=12.18.0",
]
vision = [
    "rfdetr[train]==1.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ninety"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
