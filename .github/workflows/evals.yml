name: evals

# Nightly evaluation of the published agents, recorded in Foundry so its Evaluations page holds a
# history: the fact-checker on planted false and true claims (ninety/eval/factcheck_eval.py) and
# the Analyst's first drafts with Foundry's agent evaluators (ninety/agents/analyst_eval.py).
# Signs in with the same OIDC identity as deploy.yml (trusted for main only, no stored secret),
# which holds Foundry User on the Foundry resource (infra/main.bicep). Costs cents a night in
# model calls.
#
# Every report records the agent definitions it ran with (ninety/agents/evidence.py). After a
# successful run, the `commit` job copies the reports unedited to docs/eval/nightly/<date>/
# (ninety/eval/nightly.py) and opens a pull request with them; it never pushes to main. That job
# has no Azure sign-in, only a token to push its own `nightly/evals-<date>` branch and open the
# PR. The repository must allow GitHub Actions to create pull requests (Settings > Actions >
# General); a PR opened with this token does not start CI by itself, so close and reopen it to
# run CI before merging. The top-level docs/eval/ reports are replaced only by a reviewed change.
on:
  schedule:
    - cron: "0 8 * * *" # 01:00 PT
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Fact-checker on held-out seeds
        run: uv run python -m ninety.eval.factcheck_eval --seeds 21,33 --foundry --out runs/eval/fact-checker.md
      - name: Analyst first drafts and Foundry agent evaluators
        run: uv run python -m ninety.agents.analyst_eval --seeds 21,33 --foundry --out runs/eval/analyst.md
      - name: Summary
        if: always()
        run: |
          for f in runs/eval/fact-checker.md runs/eval/analyst.md; do
            [ -f "$f" ] && sed -n '1,/^## /p' "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: runs/eval/

  commit:
    # Only a run in which every evaluation finished: a run that measured an outage publishes
    # nothing (lesson 131).
    needs: evals
    if: needs.evals.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          name: eval-reports
          path: runs/eval
      - name: Archive the reports
        run: |
          night=$(date -u +%F)
          echo "NIGHT=$night" >> "$GITHUB_ENV"
          uv run python -m ninety.eval.nightly runs/eval --date "$night" --body runs/nightly-body.md \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="nightly/evals-$NIGHT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "docs/eval/nightly/$NIGHT"
          git commit -m "Nightly agent evaluation, $NIGHT"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Nightly agent evaluation, $NIGHT" \
            --body-file runs/nightly-body.md
