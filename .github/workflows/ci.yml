name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run on its previous head, so queued runs on superseded
# heads stop taking runners. A run on main is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .

  pytest:
    # Every test, split over three machines per Python version (tests/conftest.py, --shard), each
    # running one worker per physical core (pytest-xdist; the runner has 2 cores, 4 threads).
    # Full-match simulations slow each other down on a shared machine, so the slowest are kept apart.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q -n 2 --shard ${{ matrix.shard }} --durations=10

  test:
    # The required checks `test (3.11)` and `test (3.12)`: green only when every shard passed.
    needs: pytest
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - run: test "${{ needs.pytest.result }}" = success

  portable:
    # The same seed must simulate the same match on every machine (docs/LESSONS.md, lesson 46):
    # the portable-math pins and the cue fixture, which embeds seed 7's events, on macOS too.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest -q tests/test_fmath.py tests/test_cues.py

  smoke:
    # Runs the CLI end to end; every event and every 100th frame must match the published schemas.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ninety-sim --seed 7 --minutes 3 --out runs/smoke
      - run: uv run ninety-validate runs/smoke  # data contract: consistency, physics, Laws (docs/GROUNDING.md)
      - run: |
          uv run python - <<'PY'
          import json
          from jsonschema import validate
          ev = json.load(open("schemas/match_event.schema.json"))
          fr = json.load(open("schemas/frame.schema.json"))
          n = 0
          for line in open("runs/smoke/events.jsonl"):
              validate(json.loads(line), ev); n += 1
          for i, line in enumerate(open("runs/smoke/frames.jsonl")):
              if i % 100 == 0:
                  validate(json.loads(line), fr)
          assert n > 0, "no events written"
          print(f"{n} events valid")
          PY

  render:
    # Renders clips in headless Chromium (software GL) and runs the render guide's checks:
    # schema validity, projection error under 1 px, complete labels, same seed same pixels.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q tests/test_render_clip.py tests/test_render_body.py
        env:
          NINETY_REQUIRE_RENDER: "1"
      - run: uv run ninety-render --seed 7 --seconds 2 --out runs/ci-clip
      - run: uv run ninety-render-check runs/ci-clip

  viewer:
    # Type-checks and builds the viewer, then drives it in headless Chromium on a bundle ninety-e2e
    # writes: trace, persona switch, keyboard alone, reduced motion (tests/test_viewer.py), and the
    # radar across a cut (tests/test_radar.py), and match mode (tests/test_match_mode.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/viewer/package-lock.json
      - run: npm ci --prefix web/viewer
      - run: npm run build --prefix web/viewer
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q tests/test_viewer.py tests/test_e2e.py tests/test_radar.py tests/test_match_mode.py
        env:
          NINETY_REQUIRE_VIEWER: "1"

  phone:
    # Type-checks and builds the phone companion and the viewer, then drives the phone at phone size
    # on its mock feed and against the companion API with the viewer pairing it: pairing, clock sync,
    # evidence, an injected question, and no ground truth on screen (tests/test_phone.py); the radar across
    # a cut, answer pictures, insights and tabs (tests/test_phone_companion.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/phone/package-lock.json
            web/viewer/package-lock.json
      - run: npm ci --prefix web/phone
      - run: npm run build --prefix web/phone
      - run: npm run build:mock --prefix web/phone  # the dev bundle with the mock feed, for the mock tests
      - run: npm ci --prefix web/viewer
      - run: npm run build --prefix web/viewer
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q tests/test_phone.py tests/test_phone_companion.py
        env:
          NINETY_REQUIRE_PHONE: "1"
      # Read-aloud in the pinned voice: the phone's player in a muted browser (tests/test_speech.py).
      - run: uv run pytest -q tests/test_speech.py
        env:
          NINETY_REQUIRE_PHONE: "1"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  infra:
    # Compiles and lints the Bicep, so a broken template fails here and not at `azd provision`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: az bicep install
      - name: Build, failing on any warning
        run: |
          az bicep build --file infra/main.bicep --stdout > arm.json 2> diagnostics.txt
          cat diagnostics.txt
          ! grep -E "(Warning|Error) " diagnostics.txt
      - name: Ground truth is sealed from the live path
        run: python3 infra/check_truth_sealed.py arm.json

  image:
    # Builds the demo image the way the deploy does, runs it and calls it, so a file the code reads
    # at run time but the image leaves out fails here, before merge (docs/LESSONS.md, lesson 100).
    # The Replay bundle is a small fixture packed here (tests/fixture_bundle.py) and served from the
    # runner, pinned by its own hash, so the job needs no release asset and no Azure. Then the live
    # smoke test (tests/test_live_smoke.py) runs against the container, as the deploy runs it live.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - name: The Dockerfile's pinned Replay bundle exists and matches its hash
        # The build below swaps in a fixture, so without this a pin to an unpublished or replaced
        # asset stays green here and fails only at deploy (docs/LESSONS.md, lesson 203).
        run: |
          url=$(sed -n 's/^ARG REPLAY_URL=//p' Dockerfile)
          sha=$(sed -n 's/^ARG REPLAY_SHA256=//p' Dockerfile)
          curl -fsSL --max-time 600 "$url" -o pinned.tar.gz  # the demo match's bundle is about 1 GB
          python3 infra/replay.py unpack pinned.tar.gz runs/pinned "$sha" && rm -rf pinned.tar.gz runs/pinned
      - name: The Dockerfile's pinned served match package exists and matches its hash
        # The build below downloads it as pinned (3 MB), so this names the failure if it does not.
        run: |
          url=$(sed -n 's/^ARG SERVED_URL=//p' Dockerfile)
          sha=$(sed -n 's/^ARG SERVED_SHA256=//p' Dockerfile)
          curl -fsSL --max-time 120 "$url" -o served.tar.gz
          python3 infra/served.py unpack served.tar.gz runs/served "$sha"
      - name: Pack a fixture Replay bundle and serve it to the build
        id: replay
        run: |
          echo "sha256=$(uv run python -m tests.fixture_bundle runs/fixture | tail -1)" >> "$GITHUB_OUTPUT"
          (cd runs/fixture && python3 -m http.server 8766 >/dev/null 2>&1 &)
      - run: >-
          docker build --network host -t ninety-api
          --build-arg NINETY_COMMIT=${{ github.sha }}
          --build-arg REPLAY_URL=http://127.0.0.1:8766/replay.tar.gz
          --build-arg REPLAY_SHA256=${{ steps.replay.outputs.sha256 }} .
      - name: The image serves health and an MCP call on the detected-events match
        run: |
          KEY=$(openssl rand -hex 16)  # made per run: no key-like literal in the repo
          echo "::add-mask::$KEY" && echo "NINETY_MCP_KEY=$KEY" >> "$GITHUB_ENV"  # for the smoke test's timed MCP calls
          docker run -d --name api -p 8000:8000 -e NINETY_MCP_KEY="$KEY" \
            -e NINETY_DEMO_PASSCODE="$(openssl rand -hex 16)" ninety-api
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          test "$(curl -fsS localhost:8000/api/health | jq -r .commit)" = "${{ github.sha }}"
          curl -fsS localhost:8000/mcp -H "x-api-key: $KEY" \
            -H "accept: application/json, text/event-stream" -H "content-type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"match_info","arguments":{"match":"seed900001"}}}' \
            | tee mcp.json
          jq -e '.result.isError == false' mcp.json
          curl -fsS localhost:8000/phone/ | grep -q '<html'  # the phone companion beside the viewer
      - name: Live smoke test against the container
        run: uv run pytest -q tests/test_live_smoke.py
        env:
          NINETY_LIVE_URL: http://127.0.0.1:8000
          NINETY_EXPECT_COMMIT: ${{ github.sha }}
          NINETY_REQUIRE_LIVE: "1"
      - name: The image upgrades the phone relay's WebSocket (uvicorn needs a WebSocket library for it)
        run: |
          docker run -d --name companion -p 8001:8000 -e NINETY_COMPANION=standin ninety-api
          for i in $(seq 1 30); do curl -fsS localhost:8001/api/health && break; sleep 1; done
          CODE=$(curl -fsS localhost:8001/api/pair -H "content-type: application/json" -d '{"clip":"seed7"}' | jq -r .code)
          NONCE=$(openssl rand -base64 16)  # the handshake's nonce, made per run (RFC 6455)
          curl -sS -i -N --max-time 3 -H "Connection: Upgrade" -H "Upgrade: websocket" \
            -H "Sec-WebSocket-Version: 13" -H "Sec-WebSocket-Key: $NONCE" \
            "localhost:8001/api/pair/$CODE?role=laptop" > ws.txt || true
          head -1 ws.txt
          head -1 ws.txt | grep -q " 101 "
      - if: failure()
        run: docker logs api || true; docker logs companion || true
