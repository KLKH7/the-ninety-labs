name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q

  smoke:
    # Runs the CLI end to end; every event and every 100th frame must match the published schemas.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ninety-sim --seed 7 --minutes 3 --out runs/smoke
      - run: uv run ninety-validate runs/smoke  # data contract: consistency, physics, Laws (docs/GROUNDING.md)
      - run: |
          uv run python - <<'PY'
          import json
          from jsonschema import validate
          ev = json.load(open("schemas/match_event.schema.json"))
          fr = json.load(open("schemas/frame.schema.json"))
          n = 0
          for line in open("runs/smoke/events.jsonl"):
              validate(json.loads(line), ev); n += 1
          for i, line in enumerate(open("runs/smoke/frames.jsonl")):
              if i % 100 == 0:
                  validate(json.loads(line), fr)
          assert n > 0, "no events written"
          print(f"{n} events valid")
          PY

  render:
    # Renders clips in headless Chromium (software GL) and runs the render guide's checks:
    # schema validity, projection error under 1 px, complete labels, same seed same pixels.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q tests/test_render_clip.py
        env:
          NINETY_REQUIRE_RENDER: "1"
      - run: uv run ninety-render --seed 7 --seconds 2 --out runs/ci-clip
      - run: uv run ninety-render-check runs/ci-clip

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
