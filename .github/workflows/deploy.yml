name: deploy

# Runs after CI passes on main. Signs in to Azure with OIDC: GitHub issues a short-lived token
# that Azure trusts only for this repo's main branch, so no Azure secret is stored anywhere.
#
# This job only deploys code (`azd deploy api`): it builds the image (API, MCP server, viewer and
# the pinned Replay bundle), pushes it, rolls a new revision and runs the live smoke test on it. Infrastructure changes are applied by `azd provision` from a maintainer's machine,
# because the deploy identity is Contributor and cannot create role assignments (infra/README.md).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AZURE_ENV_NAME: prod
  AZURE_LOCATION: northcentralus
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  # Deploy exactly the commit CI passed, not whatever main points at when this job starts.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Check deployment freshness
        id: freshness
        if: github.event_name == 'workflow_run'
        run: |
          latest_main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$latest_main_sha" = "$DEPLOY_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded automatic deployment for $DEPLOY_SHA; main is $latest_main_sha"
          fi
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/setup-azd@v2
      - name: Sign azd in with the same OIDC identity
        run: >-
          azd auth login --federated-credential-provider github
          --client-id "${{ vars.AZURE_CLIENT_ID }}" --tenant-id "${{ vars.AZURE_TENANT_ID }}"
      - name: Point azd at the provisioned registry
        run: |
          registry=$(az acr list -g "$AZURE_RESOURCE_GROUP" \
            --query "[?tags.\"azd-env-name\"=='$AZURE_ENV_NAME'].loginServer | [0]" -o tsv)
          test -n "$registry" || { echo "no registry for env $AZURE_ENV_NAME: run azd provision first"; exit 1; }
          azd env new "$AZURE_ENV_NAME" --no-prompt
          azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "$registry"
          azd env set NINETY_COMMIT "$DEPLOY_SHA"
      - run: azd deploy api --no-prompt
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.current == 'true'
      - name: Wait for the live revision
        # Passes only when the public URL answers with the commit just deployed, so an old
        # revision still serving traffic is a failure, not a pass.
        id: live
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.current == 'true'
        run: |
          fqdn=$(az containerapp list -g "$AZURE_RESOURCE_GROUP" \
            --query "[?tags.\"azd-service-name\"=='api' && tags.\"azd-env-name\"=='$AZURE_ENV_NAME'].properties.configuration.ingress.fqdn | [0]" -o tsv)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 20); do
            body=$(curl -fsS --max-time 30 "https://$fqdn/api/health" || true)
            echo "attempt $attempt: $body"
            if [ "$(echo "$body" | jq -r .commit 2>/dev/null)" = "$DEPLOY_SHA" ]; then exit 0; fi
            sleep 15
          done
          echo "https://$fqdn/api/health never reported commit $DEPLOY_SHA"
          exit 1
      - uses: astral-sh/setup-uv@v7
        if: steps.live.outcome == 'success'
      - name: Live smoke test
        # The deployed demo in headless Chromium: the viewer plays the Replay bundle with its
        # graphics, the keyed routes are configured and closed, no answer key is served
        # (tests/test_live_smoke.py). NINETY_REQUIRE_LIVE makes a missing URL a failure, not a skip.
        if: steps.live.outcome == 'success'
        env:
          NINETY_LIVE_URL: ${{ steps.live.outputs.url }}
          NINETY_EXPECT_COMMIT: ${{ env.DEPLOY_SHA }}
          NINETY_REQUIRE_LIVE: "1"
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium
          uv run pytest -q tests/test_live_smoke.py
