name: ci-experiment
# Temporary: measures the test suite split across runners. Removed before merge.
on:
  pull_request:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2", "1/1"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q -n 2 --shard ${{ matrix.shard }} --durations=20 -p no:cacheprovider
